<!DOCTYPE html>
<html>

<head>
    <title>Test Redirect Logic</title>
</head>

<body>
    <h1>Testing Route Detection</h1>
    <p>Current URL: <span id="currentUrl"></span></p>
    <p>Route parameter: <span id="routeParam"></span></p>
    <p>Would redirect to: <span id="redirectTo"></span></p>

    <script>
        document.getElementById('currentUrl').textContent = window.location.href;

        var rutaActual = new URLSearchParams(window.location.search).get("ruta");
        document.getElementById('routeParam').textContent = rutaActual || '(not found)';

        if (!rutaActual) {
            rutaActual = "crear-venta";
        }
        document.getElementById('redirectTo').textContent = rutaActual;
    </script>
</body>

</html>
