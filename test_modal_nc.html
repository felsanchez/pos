<!DOCTYPE html>
<html>

<head>
    <title>Test NC Modal</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/6.11.5/sweetalert2.all.min.js"></script>
</head>

<body>
    <div class="container" style="margin-top: 50px;">
        <h2>Test: Botón Generar NC</h2>
        <table class="table table-bordered tablas">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Código</th>
                    <th>Cliente</th>
                    <th>Vendedor</th>
                    <th>Forma de pago</th>
                    <th>Imagen</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>SETP990000134</td>
                    <td>Juan Pérez SAS</td>
                    <td>Admin</td>
                    <td>Contado</td>
                    <td>-</td>
                    <td>$1,250,000</td>
                    <td>
                        <button class="btn btn-danger btnGenerarNC" idVenta="123" numeroFactura="SETP990000134"
                            title="Generar Nota Crédito">
                            <i class="fa fa-undo"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Modal NC (copiar de facturas-electronicas.php) -->
        <div class="modal fade" id="modalNotaCredito" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-danger">
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                        <h4 class="modal-title"><i class="fa fa-undo"></i> Generar Nota Crédito</h4>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="ncIdVenta">

                        <div class="alert alert-info">
                            <p><strong>Factura:</strong> <span id="ncNumeroFactura"></span></p>
                            <p><strong>Cliente:</strong> <span id="ncCliente"></span></p>
                            <p><strong>Total:</strong> $<span id="ncTotal"></span></p>
                        </div>

                        <div class="form-group">
                            <label>Tipo de Nota Crédito:</label>
                            <select class="form-control" id="ncTipo">
                                <option value="anulacion_total">Anulación Total</option>
                                <option value="devolucion_parcial">Devolución Parcial</option>
                                <option value="ajuste_precio">Ajuste de Precio</option>
                                <option value="descuento_posterior">Descuento Posterior</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Motivo <span class="text-danger">*</span>:</label>
                            <textarea class="form-control" id="ncMotivo" rows="3"
                                placeholder="Ej: Error en digitación de precio..."></textarea>
                        </div>

                        <div class="alert alert-warning">
                            <i class="fa fa-warning"></i> Esta acción generará una Nota Crédito oficial ante la DIAN y
                            <strong>no puede revertirse</strong>.
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="btnConfirmarNC">
                            <i class="fa fa-check"></i> Generar Nota Crédito
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="vistas/js/notas-credito.js"></script>

    <script>
        // Mock del botón confirmar para evitar error de AJAX
        $("#btnConfirmarNC").click(function () {
            alert("Mock: NC se generaría aquí");
            $("#modalNotaCredito").modal("hide");
        });
    </script>
</body>

</html>
